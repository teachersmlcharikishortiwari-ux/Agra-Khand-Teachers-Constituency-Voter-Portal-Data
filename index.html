<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agra Khand Teachers Voter Portal</title>
<style>
:root{--saf:#E4600F;--green:#1B6B3A;--ink:#262626;--bg:#f4f6f8;--line:#d9dee5}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Devanagari",sans-serif;color:var(--ink);background:var(--bg)}
.top{background:var(--saf);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0002}
.top h1{font-size:1.15rem;margin:0 0 4px}.top p{margin:0;font-size:.82rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:66px;z-index:4;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);border-radius:8px;background:#f6f7f9;color:#333;padding:10px 13px;font:inherit;font-size:.88rem;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:#e7f4eb;border-color:var(--green);color:var(--green);font-weight:700}
main{padding:0}iframe{display:block;width:100%;height:calc(100dvh - 126px);min-height:560px;border:0;background:#fff}.hint{padding:8px 12px;font-size:.78rem;background:#fff8e6;color:#6c4d00;border-bottom:1px solid #f0dfae}
@media(max-width:600px){.top{padding:10px 12px}.top h1{font-size:1rem}.tabs{top:62px}iframe{height:calc(100dvh - 122px);min-height:500px}}
</style></head><body>
<header class="top"><h1>आगरा खंड शिक्षक निर्वाचन क्षेत्र — संयुक्त पोर्टल</h1><p>सभी डैशबोर्ड एक जगह • ऊपर टैब दबाकर सेक्शन बदलें</p></header>
<nav class="tabs" role="tablist" aria-label="Dashboard sheets"><button class="tab" role="tab" id="tab0" aria-selected="true" aria-controls="panel" data-file="parchi-v12.html">मतदाता खोज</button>
<button class="tab" role="tab" id="tab1" aria-selected="false" aria-controls="panel" data-file="parchi-v8.html">मतदाता पर्ची v8</button>
<button class="tab" role="tab" id="tab2" aria-selected="false" aria-controls="panel" data-file="school-parchi-v4.html">विद्यालय पर्ची</button>
<button class="tab" role="tab" id="tab3" aria-selected="false" aria-controls="panel" data-file="voter-list-dashboard-v3.html">वोटर सूची v3</button>
<button class="tab" role="tab" id="tab4" aria-selected="false" aria-controls="panel" data-file="voter-list-dashboard.html">वोटर सूची</button>
<button class="tab" role="tab" id="tab5" aria-selected="false" aria-controls="panel" data-file="sampark-parchi-dashboard.html">WhatsApp पर्ची</button>
<button class="tab" role="tab" id="tab6" aria-selected="false" aria-controls="panel" data-file="school-vote-count-dashboard.html">वोट गिनती</button>
<button class="tab" role="tab" id="tab7" aria-selected="false" aria-controls="panel" data-file="dashboard-zip.html">जिला ZIP</button>
<button class="tab" role="tab" id="tab8" aria-selected="false" aria-controls="panel" data-file="etawah-dashboard.html">इटावा</button>
<button class="tab" role="tab" id="tab9" aria-selected="false" aria-controls="panel" data-file="gyan-sthali-dashboard.html">ज्ञान स्थली</button></nav>
<div class="hint">हर टैब में मूल HTML डैशबोर्ड खुलता है। सभी फाइलें एक ही फ़ोल्डर में रखें; तभी टैब सही चलेंगे।</div>
<main><iframe id="panel" title="Dashboard" src="parchi-v12.html" loading="eager" referrerpolicy="no-referrer"></iframe></main>
<script>
const tabs=[...document.querySelectorAll('.tab')];const frame=document.getElementById('panel');
for(const tab of tabs){tab.addEventListener('click',()=>{for(const t of tabs)t.setAttribute('aria-selected',String(t===tab));frame.src=tab.dataset.file;frame.title=tab.textContent;})}
</script></body></html>
